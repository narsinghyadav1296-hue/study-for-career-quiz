{% extends "admin/base_admin.html" %}
{% block title %}Edit Question{% endblock %}
{% block content %}
<h1 class="admin-title">Edit Question — {{ quiz['title'] }}</h1>
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

<div class="admin-card">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
      <label for="question">Question *</label>
      <textarea class="form-control" id="question" name="question" required>{{ question['question'] }}</textarea>
    </div>
    <div class="form-row two-col">
      <div class="form-group"><label>Option A *</label><input class="form-control" name="option_a" required value="{{ question['option_a'] }}"></div>
      <div class="form-group"><label>Option B *</label><input class="form-control" name="option_b" required value="{{ question['option_b'] }}"></div>
    </div>
    <div class="form-row two-col">
      <div class="form-group"><label>Option C *</label><input class="form-control" name="option_c" required value="{{ question['option_c'] }}"></div>
      <div class="form-group"><label>Option D *</label><input class="form-control" name="option_d" required value="{{ question['option_d'] }}"></div>
    </div>
    <div class="form-group">
      <label>Correct Answer *</label>
      <select class="form-control" name="correct_answer" required>
        {% for i, label in [(0,'Option A'), (1,'Option B'), (2,'Option C'), (3,'Option D')] %}
          <option value="{{ i }}" {% if question['correct_answer']==i %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Topic (optional)</label>
      <input class="form-control" name="topic" value="{{ question['topic'] or '' }}">
    </div>
    <div class="form-group">
      <label>Explanation (optional)</label>
      <textarea class="form-control" name="explanation">{{ question['explanation'] or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Save Question</button>
  </form>
</div>
<a class="btn btn-secondary btn-block" href="{{ url_for('admin_quiz.manage_questions', quiz_id=quiz['id']) }}">← Back to Questions</a>
{% endblock %}
